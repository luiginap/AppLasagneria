  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

var pNums=pn.match(/\\d+/g)||[];\n    nNums.forEach(function(n){if(pNums.indexOf(n)>=0)score+=3;});\n    if(score>bestScore){bestScore=score;best=p;}\n  });\n  return bestScore>=4?best:null;\n}\n\n// ── Render helpers ───────────────────────────────────────\nfunction stp(sid,pid,par,unit,dir){\n  var st=getState(sid,pid,par);\n  var s=unit==='kg'?0.5:1;\n  var q=Math.max(0,Math.round((st.qty+dir*s)*10)/10);\n  setState(sid,pid,par,{qty:q,on:q>0});\n}\nfunction acceptSug(sid,pid,par,sugVal){setState(sid,pid,par,{qty:sugVal,on:sugVal>0});}\n\nfunction rItem(sup,prod,isX){\n  var par=getPar(sup,prod);\n  var st=getState(sup.id,prod.id,par);\n  var on=st.on!==false,qty=st.qty;\n  var sm=isX?' sm':'';\n  var h='<div class=\"item-row'+(on?'':' excl')+(isX?' xrow':'')+'\">';\n  h+='<label class=\"sw\"><input type=\"checkbox\"'+(on?' checked':'')+' onchange=\"setState(\\''+sup.id+'\\',\\''+prod.id+'\\','+par+',{on:this.checked,qty:this.checked?'+(par>0?par:1)+':0});\"><span class=\"sw-t\"><\u002Fspan><span class=\"sw-k\"><\u002Fspan><\u002Flabel>';\n  // Frequency badge\n  var fbadge='';\n  if(prod.freq!=null){\n    if(prod.freq>=0.7)fbadge=' <span class=\"fbadge core\" title=\"Core – '+(prod.freqText||'')+' consegne\">🔥 '+(prod.freqText||'')+'<\u002Fspan>';\n    else if(prod.freq>=0.4)fbadge=' <span class=\"fbadge warm\" title=\"Frequente – '+(prod.freqText||'')+'\">⚡ '+(prod.freqText||'')+'<\u002Fspan>';\n  }\n  h+='<div class=\"iinfo\"><div class=\"iname'+(on?'':' off')+(isX?' sm':'')+'\">'+prod.name+fbadge+'<\u002Fdiv>';\n  if(prod.note&&!isX)h+='<div class=\"inote\">'+prod.note+'<\u002Fdiv>';\n  if(!isX){\n    var sug=getSuggested(sup.id,prod.id);\n    h+='<div class=\"imeta\">par: '+par;\n    if(prod.wk!=null)h+=' · <strong>'+prod.wk+' '+prod.unit+'/sett storico<\u002Fstrong>';\n    if(prod.price!=null)h+=' · <span class=\"iprice\">£'+prod.price.toFixed(2)+'/'+prod.unit+'<\u002Fspan>';\n    if(sug!==null&&Math.abs(sug-par)>0.4)h+=' <span class=\"sug\" onclick=\"acceptSug(\\''+sup.id+'\\',\\''+prod.id+'\\','+par+','+sug+')\">💡 suggerito: '+sug+'<\u002Fspan>';\n    h+='<\u002Fdiv>';\n  }\n  h+='<\u002Fdiv>';\n  if(on){\n    h+='<div class=\"stepper\"><button class=\"stb dec'+sm+'\" onclick=\"stp(\\''+sup.id+'\\',\\''+prod.id+'\\','+par+',\\''+prod.unit+'\\',-1)\">\\u2212<\u002Fbutton>';\n    h+='<span class=\"stv'+sm+'\">'+qty+'<\u002Fspan>';\n    h+='<button class=\"stb inc'+sm+'\" onclick=\"stp(\\''+sup.id+'\\',\\''+prod.id+'\\','+par+',\\''+prod.unit+'\\',1)\">+<\u002Fbutton><\u002Fdiv>';\n  }else h+='<span class=\"stv na\">\\u2014<\u002Fspan>';\n  return h+'<span class=\"iunit\">'+prod.unit+'<\u002Fspan><\u002Fdiv>';\n}\n\nfunction genMsg(sup){\n  var lines=[];\n  sup.products.forEach(function(prod){\n    var par=getPar(sup,prod);\n    var st=getState(sup.id,prod.id,par);\n    if(!st.on||st.qty<=0)return;\n    lines.push(' '+String(st.qty).padStart(2)+' '+prod.unit.padEnd(6)+'  '+prod.name);\n  });\n  return'Ciao! Ordine '+sup.name+' \\u2014 '+loc+':\\n\\n'+lines.join('\\n')+'\\n\\nGrazie!';\n}\n\nfunction cpyMsg(sid){\n  var sup=SUPS.find(function(s){return s.id===sid;});if(!sup)return;\n  var msg=genMsg(sup);\n  function ok(){copiedSup=sid;render();setTimeout(function(){copiedSup=null;render();},2500);}\n  if(navigator.clipboard)navigator.clipboard.writeText(msg).then(ok).catch(ok);\n  else{var t=document.createElement('textarea');t.value=msg;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.focus();t.select();document.execCommand('copy');document.body.removeChild(t);ok();}\n}\nfunction waMsg(sid){\n  var sup=SUPS.find(function(s){return s.id===sid;});if(!sup)return;\n  var msg=genMsg(sup);\n  // Pre-copia negli appunti (fallback se l'utente perde il testo nel passaggio)\n  try{if(navigator.clipboard)navigator.clipboard.writeText(msg);}catch(e){}\n  // Apri WhatsApp SENZA destinatario preimpostato → l'utente sceglie il contatto\n  window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');\n}\n\n// ── Import flow ──────────────────────────────────────────\nfunction openImport(sid){impSup=sid;impStep='idle';impMode='img';impText='';impImages=[];impResult=null;impErr=null;render();}\nfunction closeImport(){impSup=null;impImages=[];impText='';impResult=null;render();}\nfunction setImpMode(m){impMode=m;render();}\n\nasync function analyzeInvoice(){\n  var hasImg=impImages.length>0,hasTxt=impText.trim().length>0;\n  if(!hasImg&&!hasTxt)return;\n  impStep='parsing';impErr=null;render();\n  try{\n    var sup=SUPS.find(function(s){return s.id===impSup;});\n    var result;\n    // Pure text + All Greens → fast regex path\n    if(!hasImg&&(sup.parseType==='allgreens'||/All Greens|allgreens|New Covent/i.test(impText))){\n      result=parseAllGreens(impText);\n    }else{\n      result=await parseWithClaude(hasTxt?impText:'',hasImg?impImages:null,sup.name);\n    }\n    // Normalize: coerce qty numbers, drop empties\n    result.items=(result.items||[]).filter(function(it){return it&&it.name;}).map(function(it){\n      it.qty=parseFloat(it.qty)||0;\n      it.unit=(it.unit||'pz').toLowerCase();\n      return it;\n    }).filter(function(it){return it.qty>0;});\n    // Match each item\n    result.items.forEach(function(it){it.matched=matchProduct(sup,it);it.manual=false;});\n    impResult=result;impStep='done';\n  }catch(e){impStep='error';impErr=e.message||String(e);}\n  render();\n}\n\n// Edit a parsed item field\nfunction editItem(i,k,v){\n  if(!impResult)return;\n  var it=impResult.items[i];if(!it)return;\n  if(k==='qty')it.qty=parseFloat(v)||0;\n  else if(k==='unit')it.unit=v;\n  else if(k==='name')it.name=v;\n  else if(k==='match'){\n    if(v==='__new__'){it.matched=null;it.manual=false;}\n    else{var sup=SUPS.find(function(s){return s.id===impSup;});\n      it.matched=sup.products.find(function(p){return p.id===v;})||null;it.manual=true;}\n  }\n  render();\n}\nfunction removeParsedItem(i){if(!impResult)return;impResult.items.splice(i,1);render();}\n\nfunction co
