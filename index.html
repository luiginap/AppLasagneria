<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F2F2F7;color:#1C1C1E;max-width:480px;margin:0 auto;min-height:100vh}
.hdr{background:#fff;padding:8px 16px 0;position:sticky;top:0;z-index:20;border-bottom:0.5px solid #C6C6C8}
.hdr-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.hdr-logo{height:44px;width:44px;flex-shrink:0;object-fit:contain}
.hdr-text{flex:1;min-width:0}
.hdr-title{font-size:15px;font-weight:700;color:#1C1C1E;line-height:1.1}
.hdr-sub{font-size:11px;color:#8E8E93;margin-top:1px}
.hdr-zoom{display:flex;gap:3px;flex-shrink:0;background:#F2F2F7;border-radius:8px;padding:2px}
.hdr-zoom button{border:none;background:none;font-size:10px;font-weight:700;padding:5px 7px;border-radius:6px;cursor:pointer;color:#8E8E93;min-width:24px}
.hdr-zoom button.on{background:#fff;color:#A86F2A;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.hdr-info{flex-shrink:0;width:28px;height:28px;border-radius:50%;border:1.5px solid #E5E5E5;background:#fff;color:#185FA5;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
.hdr-info:active{background:#F2F2F7}
.htab{flex:1;padding:9px 0;font-size:14px;font-weight:500;text-align:center;cursor:pointer;color:#8E8E93;border:none;border-bottom:2px solid transparent;background:none}
.htab.active{color:#A86F2A;border-bottom-color:#A86F2A}
.hdr h1{font-size:17px;font-weight:700}
.hdr-tabs{display:flex}
/* Zoom levels — scala visivamente tutto via CSS zoom (supportato Chrome/Safari/Edge/FF126+) */
html[data-zoom="s"] body{zoom:0.88}
html[data-zoom="m"] body{zoom:1}
html[data-zoom="l"] body{zoom:1.15}
.loc-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px 4px}
.loc-btn{padding:11px;border-radius:12px;border:1.5px solid #D1D1D6;background:#fff;font-size:15px;font-weight:600;cursor:pointer;color:#8E8E93;text-align:center}
.loc-btn.nh.on{background:#E6F1FB;border-color:#185FA5;color:#0C447C}
.loc-btn.ch.on{background:#EAF3DE;border-color:#3B6D11;color:#27500A}
.banner{margin:8px 16px;padding:9px 12px;border-radius:10px;font-size:12px;line-height:1.4}
.banner.nh{background:#E6F1FB;color:#0C447C}.banner.ch{background:#EAF3DE;color:#27500A}
.cards{padding:0 16px 100px}
.card{background:#fff;border-radius:14px;overflow:hidden;margin-bottom:10px;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.chd{padding:14px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;min-height:58px}
.chd:active{background:#F9F9F9}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.chd-info{flex:1;min-width:0}
.sname{font-size:15px;font-weight:700;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.sfreq{font-size:12px;color:#8E8E93;margin-top:2px}
.xbadge{font-size:11px;font-weight:600;padding:2px 7px;border-radius:8px;background:#FFECEC;color:#C00}
.abadge{font-size:11px;font-weight:600;padding:2px 7px;border-radius:8px;background:#EAF3DE;color:#1A7D2E}
.chev{font-size:16px;color:#C7C7CC;flex-shrink:0;transition:transform .2s}
.chev.open{transform:rotate(180deg)}
.cbody{border-top:0.5px solid #F2F2F7}
.cinfo{padding:8px 16px;font-size:12px;color:#8E8E93;background:#FAFAFA;border-bottom:0.5px solid #F2F2F7}
.cnote{padding:8px 16px;font-size:12px;color:#7A4800;background:#FFF8EC;border-bottom:0.5px solid #FFEFD1}
.sec-lbl{padding:10px 16px 4px;font-size:11px;font-weight:700;color:#8E8E93;text-transform:uppercase;letter-spacing:.06em;background:#FAFAFA;border-bottom:0.5px solid #F2F2F7}
.item-row{display:flex;align-items:center;padding:9px 16px;border-bottom:0.5px solid #F2F2F7;gap:10px;min-height:48px}
.item-row.excl{opacity:.5;background:#FAFAFA}
.item-row.xrow{background:#FFFDF5;min-height:42px;padding:7px 16px}
.sw{width:44px;height:26px;position:relative;flex-shrink:0;cursor:pointer}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw-t{position:absolute;inset:0;border-radius:13px;background:#D1D1D6;transition:background .2s}
.sw input:checked~.sw-t{background:#30D158}
.sw-k{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw input:checked~.sw-k{transform:translateX(18px)}
.iinfo{flex:1;min-width:0}
.iname{font-size:14px;font-weight:500;line-height:1.3}
.iname.off{text-decoration:line-through;color:#8E8E93}
.iname.sm{font-size:13px;font-weight:400}
.iname{word-wrap:break-word;overflow-wrap:break-word;white-space:normal}
.imeta{font-size:11px;color:#AEAEB2;margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sug{font-size:10px;background:#E6F1FB;color:#185FA5;padding:1px 6px;border-radius:6px;cursor:pointer;font-weight:600}
.fbadge{font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px}
.fbadge.core{background:#FFEBE0;color:#C04A0F}
.fbadge.warm{background:#FFF8E0;color:#8A6A0A}
.inote{font-size:11px;color:#9A6500;margin-top:2px;line-height:1.3;background:#FFF8EC;padding:3px 8px;border-radius:6px;display:inline-block}
.iprice{font-size:10px;color:#666;font-weight:600}
.search-row{padding:8px 12px;background:#FAFAFA;border-bottom:0.5px solid #F2F2F7;position:relative}
.search-row input{width:100%;padding:8px 32px 8px 32px;border:1px solid #E5E5E5;border-radius:10px;font-size:13px;background:#fff;outline:none}
.search-row input:focus{border-color:#185FA5}
.search-row::before{content:'🔍';position:absolute;left:20px;top:50%;transform:translateY(-50%);font-size:13px;pointer-events:none}
.search-row .clr{position:absolute;right:18px;top:50%;transform:translateY(-50%);width:22px;height:22px;border:none;border-radius:50%;background:#E5E5E5;color:#666;font-size:13px;cursor:pointer;display:none;align-items:center;justify-content:center;padding:0;line-height:1}
.search-row.has-val .clr{display:flex}
.stepper{display:flex;align-items:center;flex-shrink:0}
.stb{width:30px;height:30px;border-radius:50%;border:none;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;background:#F2F2F7;color:#1C1C1E;flex-shrink:0}
.stb:active{background:#E5E5EA}.stb.dec{color:#FF3B30}.stb.inc{color:#30D158}
.stb.sm{width:26px;height:26px;font-size:16px}
.stv{width:40px;text-align:center;font-size:15px;font-weight:700}
.stv.na{color:#C7C7CC;font-weight:400;font-size:13px}.stv.sm{width:34px;font-size:14px}
.iunit{font-size:11px;color:#AEAEB2;width:30px;text-align:right;flex-shrink:0}
.cat-div{padding:5px 16px;font-size:10px;font-weight:700;color:#B07700;text-transform:uppercase;letter-spacing:.06em;background:#FFFDF5;border-bottom:0.5px solid #FFF0CC}
.xbtn{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;background:#FFFBF0;border-top:0.5px solid #FFF0CC;cursor:pointer;font-size:13px;font-weight:600;color:#854F0B}
.xbtn:active{background:#FFF0CC}
.actions{padding:12px 16px;display:flex;gap:8px;align-items:center;border-top:0.5px solid #F2F2F7;background:#FAFAFA}
.btn-rst{padding:9px 10px;border-radius:10px;border:1.5px solid #D1D1D6;background:#fff;font-size:12px;font-weight:600;cursor:pointer;color:#8E8E93;white-space:nowrap}
.btn-imp{padding:9px 10px;border-radius:10px;border:1.5px solid #EF9F27;background:#FAEEDA;font-size:12px;font-weight:600;cursor:pointer;color:#633806;white-space:nowrap}
.btn-cpy{flex:1;padding:11px;border-radius:10px;border:1.5px solid #D1D1D6;background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:#1C1C1E;display:flex;align-items:center;justify-content:center;gap:5px}
.btn-cpy.ok{border-color:#30D158;color:#1A7D2E;background:#EAF3DE}
.btn-wa{flex:1;padding:11px;border-radius:10px;border:none;background:#25D366;font-size:13px;font-weight:600;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;gap:5px}
.btn-em{flex:1;padding:11px;border-radius:10px;border:none;background:#185FA5;font-size:13px;font-weight:600;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;gap:5px}
.btn-em:active{background:#0C447C}
/* Modal */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:100}
.mdl{background:#fff;border-radius:20px 20px 0 0;width:100%;max-height:90vh;overflow-y:auto;padding:20px 16px 40px}
.mdl-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mdl-title{font-size:16px;font-weight:700}
.btn-x{width:32px;height:32px;border-radius:50%;border:none;background:#F2F2F7;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#8E8E93}
.ta{width:100%;height:140px;padding:10px;border:1px solid #D1D1D6;border-radius:12px;font-size:12px;font-family:monospace;resize:none;background:#FAFAFA}
.ta:focus{outline:none;border-color:#185FA5}
.parse-info{padding:10px 12px;background:#E6F1FB;border-radius:10px;font-size:13px;color:#0C447C;margin:10px 0}
.parse-list{margin:10px 0;max-height:220px;overflow-y:auto;border:1px solid #E5E5E5;border-radius:10px}
.parse-row{display:grid;grid-template-columns:44px 50px 1fr;gap:4px;padding:7px 12px;border-bottom:0.5px solid #F2F2F7;font-size:13px;align-items:center}
.parse-row:last-child{border-bottom:none}
.parse-row.new{background:#FFF8EC}
.btn-analyze{width:100%;padding:13px;border-radius:12px;border:none;background:#185FA5;color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-top:10px}
.btn-analyze:active{background:#0C447C}
.btn-analyze:disabled{background:#C7C7CC;cursor:default}
.btn-confirm{width:100%;padding:13px;border-radius:12px;border:none;background:#30D158;color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px}
.btn-confirm:active{background:#25A244}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.hist-row{padding:8px 12px;border-bottom:0.5px solid #F2F2F7;font-size:12px;color:#3A3A3C}
.hist-row:last-child{border-bottom:none}
/* Import — image upload */
.imp-tabs{display:flex;gap:6px;margin-bottom:10px;background:#F2F2F7;border-radius:10px;padding:3px}
.imp-tab{flex:1;padding:8px 4px;font-size:12px;font-weight:600;border:none;background:none;color:#8E8E93;border-radius:8px;cursor:pointer}
.imp-tab.on{background:#fff;color:#185FA5;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.drop{border:2px dashed #C7C7CC;border-radius:12px;padding:18px 12px;text-align:center;background:#FAFAFA;transition:all .15s;cursor:pointer}
.drop.hover{border-color:#185FA5;background:#E6F1FB}
.drop-ico{font-size:32px;margin-bottom:4px}
.drop-t{font-size:14px;font-weight:600;color:#1C1C1E}
.drop-s{font-size:11px;color:#8E8E93;margin-top:3px;line-height:1.4}
.cam-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.cam-btn{padding:11px;border-radius:10px;border:1.5px solid #D1D1D6;background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:#1C1C1E;display:flex;align-items:center;justify-content:center;gap:6px}
.cam-btn:active{background:#F2F2F7}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#000;border:1.5px solid #E5E5E5}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb-x{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;border:none;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;padding:0}
.thumb-n{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font-size:10px;padding:8px 4px 3px;text-align:center;font-weight:600}
.parse-row.edit{display:grid;grid-template-columns:44px 50px 1fr auto;gap:4px;padding:6px 8px;border-bottom:0.5px solid #F2F2F7;align-items:center}
.parse-row.edit input,.parse-row.edit select{font-size:13px;padding:5px 6px;border:1px solid #D1D1D6;border-radius:6px;background:#fff;width:100%;min-width:0}
.parse-row.edit .rm{width:24px;height:24px;border-radius:50%;border:none;background:#FFECEC;color:#C00;font-size:14px;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
.match-pill{display:inline-block;font-size:10px;padding:1px 6px;border-radius:6px;background:#EAF3DE;color:#1A7D2E;font-weight:600;margin-left:4px}
.match-pill.new{background:#FFF8EC;color:#854F0B}
.match-pill.man{background:#E6F1FB;color:#185FA5}
.hist-box{padding:0 16px;background:#FAFAFA;border-bottom:0.5px solid #F2F2F7}
.hist-list{padding:6px 0;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.hist-chip{flex-shrink:0;padding:5px 9px;border-radius:14px;background:#fff;border:1px solid #E5E5E5;font-size:11px;color:#3A3A3C;display:flex;align-items:center;gap:4px;cursor:pointer}
.hist-chip:active{background:#F2F2F7}
.hist-chip .n{font-weight:700;color:#185FA5}
.hist-chip .del{margin-left:2px;color:#C7C7CC;font-size:13px}
.help-toggle{font-size:11px;color:#185FA5;cursor:pointer;text-decoration:underline;margin-top:6px;display:inline-block}
/* Status */
.sc{background:#fff;border-radius:12px;overflow:hidden;margin-bottom:10px;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.sr{display:flex;align-items:center;padding:11px 16px;border-bottom:0.5px solid #F2F2F7;gap:10px}
.sr:last-child{border-bottom:none}
.sbg{font-size:11px;font-weight:600;padding:3px 9px;border-radius:8px;flex-shrink:0}
.ok{background:#EAF3DE;color:#1A7D2E}.warn{background:#FFF8EC;color:#7A4800}
</style>

        if (p.parNH === 0) p.parNH = par; // replica Chelsea→NH
      }
    }
  });
});

function loadOS(){
  try{var s=localStorage.getItem('ml_v5');if(s)OS=JSON.parse(s);}catch(e){}
  try{var z=localStorage.getItem('ml_zoom');if(z)zoom=z;}catch(e){}
  document.documentElement.setAttribute('data-zoom',zoom);
}
function saveOS(){try{localStorage.setItem('ml_v5',JSON.stringify(OS));}catch(e){}}
function setZoom(z){
  zoom=z;
  document.documentElement.setAttribute('data-zoom',z);
  try{localStorage.setItem('ml_zoom',z);}catch(e){}
  document.querySelectorAll('.hdr-zoom button').forEach(function(b){
    b.classList.toggle('on',b.dataset.z===z);
  });
}

function getPar(sup,prod){return loc==='NH'?prod.parNH:prod.parCH;}
function getState(sid,pid,par){var ov=(OS.overrides[loc][sid]||{})[pid];return ov!=null?ov:{qty:par,on:par>0};}
function setState(sid,pid,par,u){
  if(!OS.overrides[loc][sid])OS.overrides[loc][sid]={};
  OS.overrides[loc][sid][pid]=Object.assign({},getState(sid,pid,par),u);
  saveOS();render();
}
function resetSup(sid){OS.overrides[loc][sid]={};saveOS();render();}

// Step rigido: 0.5 per unità decimali (kg/lt), 1 per unità a pezzi
function getStep(unit){
  var dec=['kg','lt','litro','litri','l'];
  return dec.indexOf((unit||'').toLowerCase())>=0?0.5:1;
}
function roundToStep(v,step){
  v=Math.max(0,v);
  return step<1?Math.round(v*2)/2:Math.round(v);
}

function getSuggested(sid,pid){
  // 1) Priorità: consumo storico dal file Consumo (campo wk sul prodotto)
  var sup=SUPS.find(function(s){return s.id===sid;});
  if(sup){var p=sup.products.find(function(x){return x.id===pid;});
    if(p&&p.wk!=null&&p.wk>0){
      // Dividi consumo settimanale per n. consegne/settimana → par per consegna
      var perWeek=parseFloat((sup.freq||'1').match(/\d+/))||1;
      var perDelivery=p.wk/perWeek;
      return perDelivery>=5?Math.ceil(perDelivery):Math.round(perDelivery*2)/2;
    }
  }
  // 2) Altrimenti: media dalle fatture importate
  var h=(OS.history[loc][sid]||[]);
  if(h.length<3)return null;
  var dates=h.map(function(inv){var p=inv.date.split('/');return p.length===3?new Date(+p[2],+p[1]-1,+p[0]).getTime():0;}).filter(function(d){return d>0;});
  if(dates.length<2)return null;
  var days=Math.max(1,(Math.max.apply(null,dates)-Math.min.apply(null,dates))/86400000+1);
  var total=h.reduce(function(s,inv){return s+(inv.items[pid]||0);},0);
  return Math.round(total/days*7*10)/10;
}

// ── Render helpers ───────────────────────────────────────
function stp(sid,pid,par,unit,dir){
  var st=getState(sid,pid,par);
  var step=getStep(unit);
  var q=roundToStep((st.qty||0)+dir*step,step);
  setState(sid,pid,par,{qty:q,on:q>0});
}
function acceptSug(sid,pid,par,sugVal){
  // Arrotonda anche il valore suggerito allo step
  var sup=SUPS.find(function(s){return s.id===sid;});
  var prod=sup&&sup.products.find(function(p){return p.id===pid;});
  var step=getStep(prod&&prod.unit);
  var v=roundToStep(parseFloat(sugVal)||0,step);
  setState(sid,pid,par,{qty:v,on:v>0});
}

function rItem(sup,prod,isX){
  var par=getPar(sup,prod);
  var st=getState(sup.id,prod.id,par);
  var on=st.on!==false,qty=st.qty;
  var sm=isX?' sm':'';
  var h='<div class="item-row'+(on?'':' excl')+(isX?' xrow':'')+'">';
  h+='<label class="sw"><input type="checkbox"'+(on?' checked':'')+' onchange="setState(\''+sup.id+'\',\''+prod.id+'\','+par+',{on:this.checked,qty:this.checked?'+(par>0?par:1)+':0});"><span class="sw-t"></span><span class="sw-k"></span></label>';
  // Frequency badge
  var fbadge='';
  if(prod.freq!=null){
    if(prod.freq>=0.7)fbadge=' <span class="fbadge core" title="Core – '+(prod.freqText||'')+' consegne">🔥 '+(prod.freqText||'')+'</span>';
    else if(prod.freq>=0.4)fbadge=' <span class="fbadge warm" title="Frequente – '+(prod.freqText||'')+'">⚡ '+(prod.freqText||'')+'</span>';
  }
  h+='<div class="iinfo" onclick="showDetail(\''+sup.id+'\',\''+prod.id+'\')" style="cursor:pointer"><div class="iname'+(on?'':' off')+(isX?' sm':'')+'">'+prod.name+fbadge+'</div>';
  if(prod.note&&!isX)h+='<div class="inote">'+prod.note+'</div>';
  if(!isX){
    var sug=getSuggested(sup.id,prod.id);
    h+='<div class="imeta">par: '+par;
    if(prod.wk!=null)h+=' · <strong>'+prod.wk+' '+prod.unit+'/sett storico</strong>';
    if(prod.price!=null)h+=' · <span class="iprice">£'+prod.price.toFixed(2)+'/'+prod.unit+'</span>';
    if(sug!==null&&Math.abs(sug-par)>0.4)h+=' <span class="sug" onclick="acceptSug(\''+sup.id+'\',\''+prod.id+'\','+par+','+sug+')">💡 suggerito: '+sug+'</span>';
    h+='</div>';
  }
  h+='</div>';
  if(on){
    h+='<div class="stepper"><button class="stb dec'+sm+'" onclick="stp(\''+sup.id+'\',\''+prod.id+'\','+par+',\''+prod.unit+'\',-1)">\u2212</button>';
    h+='<span class="stv'+sm+'">'+qty+'</span>';
    h+='<button class="stb inc'+sm+'" onclick="stp(\''+sup.id+'\',\''+prod.id+'\','+par+',\''+prod.unit+'\',1)">+</button></div>';
  }else h+='<span class="stv na">\u2014</span>';
  return h+'<span class="iunit">'+prod.unit+'</span></div>';
}

function genMsg(sup){
  var lines=[];
  sup.products.forEach(function(prod){
    var par=getPar(sup,prod);
    var st=getState(sup.id,prod.id,par);
    if(!st.on||st.qty<=0)return;
    lines.push(' '+String(st.qty).padStart(2)+' '+prod.unit.padEnd(6)+'  '+prod.name);
  });
  return'Ciao! Ordine '+sup.name+' \u2014 '+loc+':\n\n'+lines.join('\n')+'\n\nGrazie!';
}

function waMsg(sid){
  var sup=SUPS.find(function(s){return s.id===sid;});if(!sup)return;
  var msg=genMsg(sup);
  // Pre-copia negli appunti (fallback se l'utente perde il testo nel passaggio)
  try{if(navigator.clipboard)navigator.clipboard.writeText(msg);}catch(e){}
  // Apri WhatsApp SENZA destinatario preimpostato → l'utente sceglie il contatto
  window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
}

  var msg=genMsg(sup);
  var ristorante=loc==='NH'?'Lasagneria Italiana Notting Hill\n42 Notting Hill Gate W11 3HZ London':'Lasagneria Italiana Chelsea\n273 Fulham Rd. SW10 9PZ London';
  var body=msg+'\n\n\n--\n'+ristorante;
  var subj='Ordine '+loc+' — '+sup.name;

function setView(v,b){curView=v;document.querySelectorAll('.htab').forEach(function(x){x.classList.remove('active');});b.classList.add('active');render();}
function setLoc(l){loc=l;openSup=null;xOpen={};render();}
function togSup(id){openSup=openSup===id?null:id;render();}
function togX(sid){xOpen[sid]=!xOpen[sid];render();}
function setSearch(sid,q){search[sid]=q;render();var el=document.getElementById('s_'+sid);if(el){el.focus();el.setSelectionRange(q.length,q.length);}}
function clearSearch(sid){search[sid]='';render();}
function matchSearch(prod,q){
  if(!q)return true;
  var n=(prod.name||'').toLowerCase();
  var c=(prod.code||'').toLowerCase();
  return n.indexOf(q.toLowerCase())>=0||c.indexOf(q.toLowerCase())>=0;
}

      if(supHist.length){
        h+='<div class="hist-box"><div style="padding:6px 0 2px;font-size:10px;font-weight:700;color:#8E8E93;text-transform:uppercase;letter-spacing:.05em">Storico fatture importate ('+supHist.length+')</div><div class="hist-list">';
        supHist.slice().reverse().forEach(function(inv,ri){
          var idx=supHist.length-1-ri;
          var n=Object.keys(inv.items||{}).length;
          h+='<div class="hist-chip" onclick="viewHistory(\''+sup.id+'\','+idx+')">📄 '+inv.date+' <span class="n">'+n+'</span></div>';
        });

      var weeklyProds=sup.products.filter(function(p){return p.weekly&&!p.cat;});

      h+='</div></div>';
    }
  }

  // Extras modal (badge +N)
  if(extrasModal){
    var esup=SUPS.find(function(s){return s.id===extrasModal;});
    if(esup){
      var extras=esup.products.filter(function(p){var pp=getPar(esup,p);if(pp>0)return false;var st=(OS.overrides[loc][esup.id]||{})[p.id];return st&&st.on&&st.qty>0;});

    var r=RUBRICA[sup.id]||{};
    h+='<div style="padding:11px 14px;border-bottom:0.5px solid #F2F2F7">';
    h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span style="width:8px;height:8px;border-radius:50%;background:'+(sup.dot||'#888')+'"></span><span style="font-size:14px;font-weight:700;flex:1">'+sup.name+'</span></div>';
    if(r.ref)h+='<div style="font-size:12px;color:#3A3A3C;margin-left:16px">👤 '+r.ref+'</div>';
    if(r.email)h+='<div style="font-size:12px;margin-left:16px;margin-top:2px"><a href="mailto:'+r.email+'" style="color:#185FA5;text-decoration:none">✉️ '+r.email+'</a></div>';
    if(r.phone)h+='<div style="font-size:12px;margin-left:16px;margin-top:2px"><a href="tel:'+r.phone.replace(/\s/g,'')+'" style="color:#185FA5;text-decoration:none">📞 '+r.phone+'</a></div>';
    if(r.phone2)h+='<div style="font-size:12px;margin-left:16px;margin-top:2px"><a href="tel:'+r.phone2.replace(/\s/g,'')+'" style="color:#185FA5;text-decoration:none">📞 '+r.phone2+'</a></div>';
    h+='<div style="font-size:11px;color:#8E8E93;margin-left:16px;margin-top:4px;line-height:1.5">⏰ cut-off '+(r.cutoff||'—')+' · 📦 min '+(r.min||'—')+' · 🚚 '+(r.consegna||'—')+'</div>';
    if(r.pwd)h+='<div style="font-size:11px;color:#854F0B;margin-left:16px;margin-top:3px;background:#FFF8EC;padding:3px 8px;border-radius:6px;display:inline-block">🔒 pwd: '+r.pwd+'</div>';
    h+='</div>';
  });
  h+='</div>';
  h+='<div style="background:#E6F1FB;border-radius:12px;padding:12px 14px;font-size:12px;line-height:1.5;color:#0C447C;margin-top:14px">';
  h+='💡 <strong>Calendario settimanale</strong> · Zaino + All Greens 3×/sett (Lun/Mer/Ven) · Sainsbury\'s 3×/sett (Mar/Gio/Sab) · Butchers 2×/sett (Lun/Gio) · La Tua Pasta 1×/sett (Ven) · Donovan 1×/sett (Mer).';
  h+='</div>';
  h+='</div>';
  return h;
}

// ── Help modal (?) ──────────────────────────────────────
var helpLang='it';
function openHelp(){helpOpen=true;render();}
function closeHelp(){helpOpen=false;render();}
function setHelpLang(l){helpLang=l;render();}

function renderHelp(){
  if(!helpOpen)return'';
  var isIt=helpLang==='it';
  var t=isIt?{
    title:'Come fare un ordine',
    s1:{n:'1',h:'Scegli la sede',b:'Tocca <b>Notting Hill</b> o <b>Chelsea</b> in alto.'},
    s2:{n:'2',h:'Apri il fornitore',b:'Tocca la card del fornitore. Le quantità sono <b>già pre-caricate</b> sui consumi reali.'},
    s3:{n:'3',h:'Regola se serve',b:'Premi <b>−</b> per ridurre, <b>+</b> per aumentare. Per escludere un articolo, spegni il toggle.'},
    s4:{n:'4',h:'Aggiungi prodotti extra',b:'Tocca la barra arancione <b>📦 Aggiungi se serve</b> → attiva quello che ti serve → entra nel messaggio.'},
    s5:{n:'5',h:'Invia l\'ordine',b:'<b>📱 WhatsApp</b>: apre la lista contatti, scegli il fornitore e invia.<br><b>📧 Email</b>: apre la posta con oggetto e indirizzo di consegna già pronti.'},
    reset:{h:'🔄 Reset',b:'Tocca <b>Reset</b> per tornare ai valori standard.'},
    imp:{h:'⚠️ Importante',b:'Non contare lo stock: le quantità sono <b>calibrate sui consumi reali</b>. Cambia solo se la settimana è diversa (evento, chiusura, ecc.).'},
    sign:'Se qualcosa finisce sempre prima o avanza sempre → scrivi a Luigi 👍'
  }:{
    title:'How to place an order',
    s1:{n:'1',h:'Choose the location',b:'Tap <b>Notting Hill</b> or <b>Chelsea</b> at the top.'},
    s2:{n:'2',h:'Open the supplier',b:'Tap the supplier card. Quantities are <b>already pre-loaded</b> based on real consumption.'},
    s3:{n:'3',h:'Adjust if needed',b:'Press <b>−</b> to reduce, <b>+</b> to increase. To exclude an item, turn off the toggle.'},
    s4:{n:'4',h:'Add extra products',b:'Tap the orange bar <b>📦 Add if needed</b> → switch on what you need → it joins the message.'},
    s5:{n:'5',h:'Send the order',b:'<b>📱 WhatsApp</b>: opens the contact picker — choose the supplier and send.<br><b>📧 Email</b>: opens mail with subject and delivery address pre-filled.'},
    reset:{h:'🔄 Reset',b:'Tap <b>Reset</b> to restore the default quantities.'},
    imp:{h:'⚠️ Important',b:'Don\'t count stock: quantities are <b>calibrated on real consumption</b>. Only change if the week is different (event, closure, etc.).'},
    sign:'If anything keeps running out or always leftovers → text Luigi 👍'
  };

  function sec(s){return'<div style="display:flex;gap:12px;margin-bottom:14px"><div style="flex-shrink:0;width:30px;height:30px;border-radius:50%;background:#185FA5;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px">'+s.n+'</div><div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:700;margin-bottom:3px">'+s.h+'</div><div style="font-size:13px;line-height:1.5;color:#3A3A3C">'+s.b+'</div></div></div>';}
  function box(s,c){return'<div style="padding:10px 12px;border-radius:10px;background:'+c.bg+';margin-bottom:8px"><div style="font-size:13px;font-weight:700;color:'+c.fg+';margin-bottom:3px">'+s.h+'</div><div style="font-size:12px;line-height:1.5;color:'+c.fg+'">'+s.b+'</div></div>';}

  var h='<div class="ovl" onclick="if(event.target===this)closeHelp()"><div class="mdl">';
  h+='<div class="mdl-hd"><span class="mdl-title">📖 '+t.title+'</span>';
  h+='<div style="display:flex;gap:6px;align-items:center">';
  h+='<button onclick="setHelpLang(\'it\')" style="border:none;background:'+(isIt?'#185FA5':'#F2F2F7')+';color:'+(isIt?'#fff':'#8E8E93')+';font-size:11px;font-weight:700;padding:5px 10px;border-radius:12px;cursor:pointer">IT</button>';
  h+='<button onclick="setHelpLang(\'en\')" style="border:none;background:'+(!isIt?'#185FA5':'#F2F2F7')+';color:'+(!isIt?'#fff':'#8E8E93')+';font-size:11px;font-weight:700;padding:5px 10px;border-radius:12px;cursor:pointer">EN</button>';
  h+='<button class="btn-x" onclick="closeHelp()">×</button>';
  h+='</div></div>';
  h+=sec(t.s1)+sec(t.s2)+sec(t.s3)+sec(t.s4)+sec(t.s5);
  h+=box(t.reset,{bg:'#F2F2F7',fg:'#3A3A3C'});
  h+=box(t.imp,{bg:'#FFF8EC',fg:'#7A4800'});
  h+='<div style="font-size:12px;color:#8E8E93;text-align:center;margin-top:14px;padding-top:12px;border-top:0.5px solid #F2F2F7">'+t.sign+'</div>';
  h+='</div></div>';
  return h;
}

function render(){
  var main=curView==='orders'?renderOrders():renderCalendar();
  document.getElementById('main').innerHTML=main+renderHelp();
}



loadOS();render();
</script>
